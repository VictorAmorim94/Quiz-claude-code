<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Quiz Verdadeiro ou Falso sobre Claude Code — do negócio ao avançado."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Quiz Claude Code</title>
    <script>
      // Aplica o tema antes do render para evitar flash de tema errado.
      (function () {
        var t = 'system';
        try {
          var raw = localStorage.getItem('qcc:theme');
          if (raw) t = JSON.parse(raw);
        } catch (e) {}
        var dark =
          t === 'dark' ||
          (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
